pipeline:
  agent: any

  parameters:
    - name: SITE_NAME
      type: string
      default: vlpl
      description: IIS Site Name

    - name: SITE_PORT
      type: string
      default: '8084'
      description: Port Number for IIS Site

    - name: APP_POOL_ROOT
      type: string
      default: vlplpoolqa
      description: Root App Pool for site

    - name: APP_POOL_SUB1
      type: string
      default: vlplusmpoolqa
      description: App Pool for sub app 1

    - name: APP_POOL_SUB2
      type: string
      default: vlplusmapipoolqa
      description: App Pool for sub app 2

    - name: FOLDER_ROOT
      type: string
      default: C:\BuildOutput\vlpl
      description: Root Folder for site

    - name: FOLDER_SUB1
      type: string
      default: C:\BuildOutput\vlplusmqa
      description: Folder for sub app 1

    - name: FOLDER_SUB2
      type: string
      default: C:\BuildOutput\usmapi
      description: Folder for sub app 2

    - name: SUB_APP1
      type: string
      default: /vlplusmqa
      description: Path for sub app 1

    - name: SUB_APP2
      type: string
      default: /vlplusmapiqa
      description: Path for sub app 2

  stages:

    - stage: Create_AppPools
      steps:
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd add apppool /name:%APP_POOL_ROOT%"
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd add apppool /name:%APP_POOL_SUB1%"
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd add apppool /name:%APP_POOL_SUB2%"

    - stage: Create_Folders
      steps:
        - bat: "if not exist %FOLDER_ROOT% mkdir %FOLDER_ROOT%"
        - bat: "if not exist %FOLDER_SUB1% mkdir %FOLDER_SUB1%"
        - bat: "if not exist %FOLDER_SUB2% mkdir %FOLDER_SUB2%"

    - stage: Create_Site
      steps:
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd add site /name:%SITE_NAME% /bindings:http/*:%SITE_PORT%: /physicalPath:%FOLDER_ROOT%"

    - stage: Assign_Site_AppPool
      steps:
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd set app \"%SITE_NAME%/\" /applicationPool:%APP_POOL_ROOT%"

    - stage: Create_Applications
      steps:
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd add app /site.name:%SITE_NAME% /path:%SUB_APP1% /physicalPath:%FOLDER_SUB1%"
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd set app \"%SITE_NAME%%SUB_APP1%\" /applicationPool:%APP_POOL_SUB1%"

        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd add app /site.name:%SITE_NAME% /path:%SUB_APP2% /physicalPath:%FOLDER_SUB2%"
        - bat: "C:\\Windows\\System32\\inetsrv\\appcmd set app \"%SITE_NAME%%SUB_APP2%\" /applicationPool:%APP_POOL_SUB2%"
