pipeline:
  agent:
    any: true

  stages:

    - stage: Checkout Code
      steps:
        - "checkout scm"

    - stage: Copy IIS Files
      steps:
        - |
          powershell '''
          Write-Host "Copying files to server"

          New-Item -ItemType Directory -Path C:\\Batchfile -Force

          Copy-Item "$env:WORKSPACE\\vlpl\\iis_structure.csv" "C:\\Batchfile\\iis_structure.csv" -Force
          Copy-Item "$env:WORKSPACE\\vlpl\\create_sites.ps1" "C:\\Batchfile\\create_sites.ps1" -Force
          '''

    - stage: Create IIS Site and Applications
      steps:
        - |
          powershell '''
          Write-Host "Running IIS Script"
          powershell.exe -ExecutionPolicy Bypass -File C:\\Batchfile\\create_sites.ps1
          '''
