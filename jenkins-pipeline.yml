pipeline:
  agent: any

  stages:

    - stage: Create_AppPools
      steps:
        - bat: |
            %windir%\system32\inetsrv\appcmd add apppool /name:"vlplpoolqa"
            %windir%\system32\inetsrv\appcmd add apppool /name:"vlplusmpoolqa"
            %windir%\system32\inetsrv\appcmd add apppool /name:"vlplusmapipoolqa"

    - stage: Create_Physical_Paths
      steps:
        - bat: |
            if not exist C:\BuildOutput\vlpl mkdir C:\BuildOutput\vlpl
            if not exist C:\BuildOutput\vlplusmqa mkdir C:\BuildOutput\vlplusmqa
            if not exist C:\BuildOutput\usmapi mkdir C:\BuildOutput\usmapi

    - stage: Create_IIS_Site
      steps:
        - bat: |
            %windir%\system32\inetsrv\appcmd add site /name:"vlpl" /bindings:http/*:8083: /physicalPath:"C:\BuildOutput\vlpl"

    - stage: Assign_Site_AppPool
      steps:
        - bat: |
            %windir%\system32\inetsrv\appcmd set app "vlpl/" /applicationPool:"vlplpoolqa"

    - stage: Create_Applications
      steps:
        - bat: |
            %windir%\system32\inetsrv\appcmd add app /site.name:"vlpl" /path:/vlplusmqa /physicalPath:"C:\BuildOutput\vlplusmqa"
            %windir%\system32\inetsrv\appcmd set app "vlpl/vlplusmqa" /applicationPool:"vlplusmpoolqa"

            %windir%\system32\inetsrv\appcmd add app /site.name:"vlpl" /path:/vlplusmapiqa /physicalPath:"C:\BuildOutput\usmapi"
            %windir%\system32\inetsrv\appcmd set app "vlpl/vlplusmapiqa" /applicationPool:"vlplusmapipoolqa"
