pipeline:
  agent: any

  environment:
    SITE_NAME: vlpl
    SITE_PORT: '8084'
    APP_POOL_ROOT: vlplpoolprod
    APP_POOL_SUB1: vlplusmpoolprod
    APP_POOL_SUB2: vlplusmapipoolprod
    FOLDER_ROOT: C:\\BuildOutput\\vlpl
    FOLDER_SUB1: C:\\BuildOutput\\vlplusmqa
    FOLDER_SUB2: C:\\BuildOutput\\usmapi
    SUB_APP1: /vlplusmqprod
    SUB_APP2: /vlplusmapiprod

  stages:

    - stage: Create_AppPools
      steps: 
        bat: |
          C:\Windows\System32\inetsrv\appcmd add apppool /name:%APP_POOL_ROOT%
          C:\Windows\System32\inetsrv\appcmd add apppool /name:%APP_POOL_SUB1%
          C:\Windows\System32\inetsrv\appcmd add apppool /name:%APP_POOL_SUB2%

    - stage: Create_Folders
      steps:
        bat: |
          if not exist %FOLDER_ROOT% mkdir %FOLDER_ROOT%
          if not exist %FOLDER_SUB1% mkdir %FOLDER_SUB1%
          if not exist %FOLDER_SUB2% mkdir %FOLDER_SUB2%

    - stage: Create_Site
      steps:
        bat: |
          C:\Windows\System32\inetsrv\appcmd add site /name:%SITE_NAME% /bindings:http/*:%SITE_PORT%: /physicalPath:%FOLDER_ROOT%
          C:\Windows\System32\inetsrv\appcmd set app %SITE_NAME%/ /applicationPool:%APP_POOL_ROOT%

    - stage: Create_Applications
      steps:
        bat: |
          C:\Windows\System32\inetsrv\appcmd add app /site.name:%SITE_NAME% /path:%SUB_APP1% /physicalPath:%FOLDER_SUB1%
          C:\Windows\System32\inetsrv\appcmd set app %SITE_NAME%%SUB_APP1% /applicationPool:%APP_POOL_SUB1%
          C:\Windows\System32\inetsrv\appcmd add app /site.name:%SITE_NAME% /path:%SUB_APP2% /physicalPath:%FOLDER_SUB2%
          C:\Windows\System32\inetsrv\appcmd set app %SITE_NAME%%SUB_APP2% /applicationPool:%APP_POOL_SUB2%
