pipeline:
  agent: any

  environment:
    SITE_NAME: vlpl
    SITE_PORT: '8084'
    ROOT_FOLDER: C:\\BuildOutput\\vlpl

  stages:

    - stage: Setup_AppPools_And_Folders
      steps:
        - script: |
            // Define all AppPools and corresponding folders and sub-app paths
            apps = [
              [name: 'vlplpoolprod', folder: 'C:\\BuildOutput\\vlpl', path: ''],
              [name: 'vlplusmpoolprod', folder: 'C:\\BuildOutput\\vlplusmqa', path: '/vlplusmqprod'],
              [name: 'vlplusmapipoolprod', folder: 'C:\\BuildOutput\\usmapi', path: '/vlplusmapiprod']
            ]

            for (app in apps) {
              // Create AppPool if it doesn't exist
              bat "C:\\Windows\\System32\\inetsrv\\appcmd list apppool /name:${app.name} || C:\\Windows\\System32\\inetsrv\\appcmd add apppool /name:${app.name}"
              
              // Create folder if it doesn't exist
              bat "if not exist \"${app.folder}\" mkdir \"${app.folder}\""
            }

    - stage: Create_Root_Site
      steps:
        - script: |
            // Create root IIS site if it doesn't exist
            bat "C:\\Windows\\System32\\inetsrv\\appcmd list site /name:%SITE_NAME% || C:\\Windows\\System32\\inetsrv\\appcmd add site /name:%SITE_NAME% /bindings:http/*:%SITE_PORT%: /physicalPath:%ROOT_FOLDER%"
            
            // Assign root site to its AppPool
            bat "C:\\Windows\\System32\\inetsrv\\appcmd set app %SITE_NAME%/ /applicationPool:vlplpoolprod"

    - stage: Create_Sub_Applications
      steps:
        - script: |
            // Loop through sub-apps (skip the first root app)
            for (app in apps[1..-1]) {
              bat "C:\\Windows\\System32\\inetsrv\\appcmd list app /site.name:%SITE_NAME% /path:${app.path} || C:\\Windows\\System32\\inetsrv\\appcmd add app /site.name:%SITE_NAME% /path:${app.path} /physicalPath:${app.folder}"
              bat "C:\\Windows\\System32\\inetsrv\\appcmd set app %SITE_NAME%%app.path% /applicationPool:${app.name}"
            }
