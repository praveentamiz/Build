pipeline:
  agent:
    any: true

  stages:

    - stage: "Run IIS Setup"
      steps:
        - |
          powershell -ExecutionPolicy Bypass -Command "
          Write-Host 'Workspace Files';
          Get-ChildItem;

          Write-Host 'Copy CSV';
          Copy-Item iis_structure.csv C:/Batchfile/iis_structure.csv -Force;

          Write-Host 'Copy Script';
          Copy-Item create_sites.ps1 C:/Batchfile/create_sites.ps1 -Force;

          Write-Host 'Run IIS Script';
          powershell -ExecutionPolicy Bypass -File C:/Batchfile/create_sites.ps1
          "
